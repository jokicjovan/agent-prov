<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546A"/>
    </marker>
    <marker id="arwa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F5496"/>
    </marker>
  </defs>

  <!-- ===== lifelines ===== -->
  <line x1="130" y1="74" x2="130" y2="545" stroke="#B7C2D2" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="440" y1="74" x2="440" y2="545" stroke="#B7C2D2" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="910" y1="74" x2="910" y2="545" stroke="#B7C2D2" stroke-width="1.3" stroke-dasharray="5 5"/>

  <!-- ===== column headers ===== -->
  <rect x="30" y="28" width="200" height="46" rx="8" fill="#F3F6FA" stroke="#8A94A6" stroke-width="1.5"/>
  <text x="130" y="49" font-size="13" font-weight="650" fill="#1F2937" text-anchor="middle">Ток обраде - LangGraph</text>
  <text x="130" y="65" font-size="10" fill="#6B7686" text-anchor="middle">логика чворова неизмењена</text>

  <rect x="340" y="28" width="200" height="46" rx="8" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="440" y="49" font-size="13" font-weight="650" fill="#1F2937" text-anchor="middle">ProvenanceMiddleware</text>
  <text x="440" y="65" font-size="10" fill="#6B7686" text-anchor="middle">оквири упарени по run_id</text>

  <rect x="810" y="28" width="200" height="46" rx="8" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="910" y="49" font-size="13" font-weight="650" fill="#1F2937" text-anchor="middle">PipelineSession</text>
  <text x="910" y="65" font-size="10" fill="#6B7686" text-anchor="middle">уређени низ записа</text>

  <!-- ===== activation bars (frame lifetimes) ===== -->
  <rect x="432" y="105" width="16" height="400" rx="2" fill="#DCE3EE" stroke="#8A94A6" stroke-width="1.2"/>
  <rect x="440" y="165" width="16" height="70" rx="2" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>
  <rect x="440" y="330" width="16" height="70" rx="2" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>

  <!-- ===== callback events ===== -->
  <line x1="130" y1="105" x2="430" y2="105" stroke="#44546A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="140" y="96" font-size="12" fill="#1F2937" font-family="'Consolas','Courier New',monospace">on_chain_start</text>
  <text x="250" y="96" font-size="10.5" fill="#6B7686">(A &#183; чвор &#8222;researcher&#8220;)</text>
  <text x="468" y="109" font-size="10.5" fill="#6B7686">отвара <tspan font-family="'Consolas','Courier New',monospace">_NodeFrame</tspan> у <tspan font-family="'Consolas','Courier New',monospace">_nodes[A]</tspan></text>

  <line x1="130" y1="165" x2="438" y2="165" stroke="#44546A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="140" y="156" font-size="12" fill="#1F2937" font-family="'Consolas','Courier New',monospace">on_chat_model_start</text>
  <text x="286" y="156" font-size="10.5" fill="#6B7686">(B &#183; родитељ A)</text>
  <text x="468" y="169" font-size="10.5" fill="#6B7686"><tspan font-family="'Consolas','Courier New',monospace">_StepFrame</tspan> у <tspan font-family="'Consolas','Courier New',monospace">_steps[B]</tspan>: временска ознака и улазне поруке</text>

  <line x1="130" y1="235" x2="438" y2="235" stroke="#44546A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="140" y="226" font-size="12" fill="#1F2937" font-family="'Consolas','Courier New',monospace">on_llm_end</text>
  <text x="221" y="226" font-size="10.5" fill="#6B7686">(B)</text>
  <text x="468" y="239" font-size="10.5" fill="#6B7686"><tspan font-family="'Consolas','Courier New',monospace">_steps.pop(B)</tspan> &#183; <tspan font-family="'Consolas','Courier New',monospace">agent_id</tspan> се разрешава из <tspan font-family="'Consolas','Courier New',monospace">_nodes[A]</tspan></text>

  <line x1="130" y1="330" x2="438" y2="330" stroke="#44546A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="140" y="321" font-size="12" fill="#1F2937" font-family="'Consolas','Courier New',monospace">on_tool_start</text>
  <text x="243" y="321" font-size="10.5" fill="#6B7686">(C &#183; родитељ A)</text>
  <text x="468" y="334" font-size="10.5" fill="#6B7686"><tspan font-family="'Consolas','Courier New',monospace">_ToolFrame</tspan> у <tspan font-family="'Consolas','Courier New',monospace">_tools[C]</tspan></text>

  <line x1="130" y1="400" x2="438" y2="400" stroke="#44546A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="140" y="391" font-size="12" fill="#1F2937" font-family="'Consolas','Courier New',monospace">on_tool_end</text>
  <text x="228" y="391" font-size="10.5" fill="#6B7686">(C)</text>
  <text x="468" y="404" font-size="10.5" fill="#6B7686"><tspan font-family="'Consolas','Courier New',monospace">_tools.pop(C)</tspan> &#183; исти поступак као за корак агента</text>

  <line x1="130" y1="505" x2="430" y2="505" stroke="#44546A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="140" y="496" font-size="12" fill="#1F2937" font-family="'Consolas','Courier New',monospace">on_chain_end</text>
  <text x="235" y="496" font-size="10.5" fill="#6B7686">(A)</text>
  <text x="468" y="509" font-size="10.5" fill="#6B7686"><tspan font-family="'Consolas','Courier New',monospace">_nodes.pop(A)</tspan> &#183; оквир се затвара, запис не настаје</text>

  <!-- ===== record emission ===== -->
  <line x1="448" y1="272" x2="806" y2="272" stroke="#2F5496" stroke-width="1.6" marker-end="url(#arwa)"/>
  <text x="470" y="264" font-size="11" fill="#2F5496" font-family="'Consolas','Courier New',monospace">add_agent_step(...)</text>
  <rect x="810" y="248" width="200" height="48" rx="8" fill="#E6ECF5" stroke="#2F5496" stroke-width="1.6"/>
  <text x="910" y="269" font-size="12.5" font-weight="600" fill="#24406F" text-anchor="middle" font-family="'Consolas','Courier New',monospace">agent_step</text>
  <text x="910" y="285" font-size="10" fill="#3B5488" text-anchor="middle">запис 1 &#183; agent_id: researcher</text>

  <line x1="448" y1="437" x2="806" y2="437" stroke="#2F5496" stroke-width="1.6" marker-end="url(#arwa)"/>
  <text x="470" y="429" font-size="11" fill="#2F5496" font-family="'Consolas','Courier New',monospace">add_tool_invocation(...)</text>
  <rect x="810" y="413" width="200" height="48" rx="8" fill="#E6ECF5" stroke="#2F5496" stroke-width="1.6"/>
  <text x="910" y="434" font-size="12.5" font-weight="600" fill="#24406F" text-anchor="middle" font-family="'Consolas','Courier New',monospace">tool_invocation</text>
  <text x="910" y="450" font-size="10" fill="#3B5488" text-anchor="middle">запис 2 &#183; agent_id: researcher</text>

  <line x1="858" y1="411" x2="858" y2="300" stroke="#2F5496" stroke-width="1.4" marker-end="url(#arwa)"/>
  <text x="868" y="360" font-size="10.5" fill="#2F5496" font-family="'Consolas','Courier New',monospace">parent_record_id</text>

  <!-- ===== legend ===== -->
  <line x1="30" y1="562" x2="1010" y2="562" stroke="#D8DEE8" stroke-width="1"/>
  <text x="30" y="583" font-size="10.5" fill="#6B7686">A, B, C су вредности <tspan font-family="'Consolas','Courier New',monospace">run_id</tspan> &#183; усправне траке приказују животни век оквира, а угнежђене траке то да оквир чвора надживљава оквире модела и алата</text>
  <text x="30" y="601" font-size="10.5" fill="#6B7686">Запис настаје на завршетку догађаја, не на почетку &#183; грешка (<tspan font-family="'Consolas','Courier New',monospace">on_llm_error</tspan>, <tspan font-family="'Consolas','Courier New',monospace">on_tool_error</tspan>) пролази истим путем и производи запис са <tspan font-family="'Consolas','Courier New',monospace">status = "error"</tspan></text>
</svg>
