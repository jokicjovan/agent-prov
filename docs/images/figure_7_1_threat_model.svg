<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 640" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif">
  <defs>
    <marker id="tl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/>
    </marker>
    <g id="ok">
      <circle r="13" fill="#E6ECF5" stroke="#2F5496" stroke-width="1.5"/>
      <path d="M-5.5,0.5 L-1.6,4.6 L6,-4.6" fill="none" stroke="#2F5496" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="half">
      <circle r="13" fill="#FFFFFF" stroke="#2F5496" stroke-width="1.5" stroke-dasharray="5 3"/>
      <path d="M0,-7 A7,7 0 0,1 0,7 Z" fill="#2F5496"/>
    </g>
    <g id="no">
      <circle r="13" fill="#F0F1F3" stroke="#A8AEB8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M-4.6,-4.6 L4.6,4.6 M4.6,-4.6 L-4.6,4.6" fill="none" stroke="#6B7686" stroke-width="2.3" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- the seal splits the figure; the line starts below its label so nothing is crossed -->
  <line x1="415" y1="102" x2="415" y2="516" stroke="#2F5496" stroke-width="2.6"/>

  <!-- ============ time axis ============ -->
  <line x1="40" y1="112" x2="790" y2="112" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#tl)"/>
  <g stroke="#8A94A6" stroke-width="1.6">
    <line x1="110" y1="106" x2="110" y2="118"/>
    <line x1="270" y1="106" x2="270" y2="118"/>
    <line x1="565" y1="106" x2="565" y2="118"/>
    <line x1="710" y1="106" x2="710" y2="118"/>
  </g>
  <text x="110" y="96" font-size="12" fill="#6B7686" text-anchor="middle">ток се извршава</text>
  <text x="270" y="96" font-size="12" fill="#6B7686" text-anchor="middle">настају записи</text>
  <text x="565" y="96" font-size="12" fill="#6B7686" text-anchor="middle">пакет путује</text>
  <text x="710" y="96" font-size="12" fill="#6B7686" text-anchor="middle">ревизор проверава</text>

  <text x="415" y="52" font-size="14" font-weight="700" fill="#24406F" text-anchor="middle">ПЕЧАЋЕЊЕ</text>
  <text x="415" y="72" font-size="10.5" font-family="Consolas, monospace" fill="#3B5488" text-anchor="middle">bundle_hash (SHA-256)</text>
  <circle cx="415" cy="112" r="6" fill="#2F5496"/>

  <!-- ============ spans ============ -->
  <rect x="40" y="140" width="367" height="30" rx="5" fill="#F0F1F3" stroke="#B7C2D2" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="223" y="160" font-size="12.5" font-weight="600" fill="#5A6577" text-anchor="middle">овде се мора веровати произвођачу</text>

  <rect x="423" y="140" width="367" height="30" rx="5" fill="#E6ECF5" stroke="#2F5496" stroke-width="1.3"/>
  <text x="606" y="160" font-size="12.5" font-weight="600" fill="#24406F" text-anchor="middle">одавде печат штити</text>

  <!-- ============ left column: before the seal ============ -->
  <rect x="40" y="188" width="367" height="96" rx="7" fill="#FFFFFF" stroke="#A8AEB8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <g transform="translate(74,236)"><use href="#no" xlink:href="#no"/></g>
  <text x="104" y="216" font-size="13" font-weight="650" fill="#1F2937">Корак који нико не прати</text>
  <text x="104" y="238" font-size="11.5" fill="#5A6577">Ако неки корак ради без међуслоја, запис</text>
  <text x="104" y="256" font-size="11.5" fill="#5A6577">о њему не настаје, па се не види да фали.</text>

  <rect x="40" y="298" width="367" height="96" rx="7" fill="#FFFFFF" stroke="#A8AEB8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <g transform="translate(74,346)"><use href="#no" xlink:href="#no"/></g>
  <text x="104" y="326" font-size="13" font-weight="650" fill="#1F2937">Измишљени записи</text>
  <text x="104" y="348" font-size="11.5" fill="#5A6577">Онај ко прави пакет може уписати кораке</text>
  <text x="104" y="366" font-size="11.5" fill="#5A6577">који се никада нису догодили.</text>

  <rect x="40" y="408" width="367" height="96" rx="7" fill="#FFFFFF" stroke="#A8AEB8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <g transform="translate(74,456)"><use href="#no" xlink:href="#no"/></g>
  <text x="104" y="436" font-size="13" font-weight="650" fill="#1F2937">Обрисан садржај</text>
  <text x="104" y="458" font-size="11.5" fill="#5A6577">Хеш и даље стоји, али ако је сам садржај</text>
  <text x="104" y="476" font-size="11.5" fill="#5A6577">обрисан, нема шта да се упореди с њим.</text>

  <!-- ============ right column: after the seal ============ -->
  <rect x="423" y="188" width="367" height="96" rx="7" fill="#FFFFFF" stroke="#2F5496" stroke-width="1.4"/>
  <g transform="translate(457,236)"><use href="#ok" xlink:href="#ok"/></g>
  <text x="487" y="216" font-size="13" font-weight="650" fill="#1F2937">Промена података у запису</text>
  <text x="487" y="238" font-size="11.5" fill="#5A6577">Промени ли се време, људска одлука или</text>
  <text x="487" y="256" font-size="11.5" fill="#5A6577">неки хеш, печат се више не слаже.</text>

  <rect x="423" y="298" width="367" height="96" rx="7" fill="#FFFFFF" stroke="#2F5496" stroke-width="1.4"/>
  <g transform="translate(457,346)"><use href="#ok" xlink:href="#ok"/></g>
  <text x="487" y="326" font-size="13" font-weight="650" fill="#1F2937">Брисање или премештање записа</text>
  <text x="487" y="348" font-size="11.5" fill="#5A6577">Избачен запис о људској одлуци или</text>
  <text x="487" y="366" font-size="11.5" fill="#5A6577">промењен редослед такође руше печат.</text>

  <rect x="423" y="408" width="367" height="96" rx="7" fill="#FFFFFF" stroke="#2F5496" stroke-width="1.4" stroke-dasharray="7 4"/>
  <g transform="translate(457,456)"><use href="#half" xlink:href="#half"/></g>
  <text x="487" y="436" font-size="13" font-weight="650" fill="#1F2937">Нов печат преко измена</text>
  <text x="487" y="458" font-size="11.5" fill="#5A6577">Печат нема тајни кључ, па ко мења садржај</text>
  <text x="487" y="476" font-size="11.5" fill="#5A6577">може израчунати и нов печат уз њега.</text>

  <!-- ============ legend ============ -->
  <rect x="40" y="540" width="750" height="72" rx="6" fill="#FAFBFD" stroke="#D6DCE5" stroke-width="1.3"/>
  <text x="62" y="564" font-size="12" font-weight="650" fill="#5A6577">Легенда</text>

  <g transform="translate(76,588) scale(0.85)"><use href="#ok" xlink:href="#ok"/></g>
  <text x="98" y="592" font-size="11.5" fill="#2B3440">печат ово открива</text>

  <g transform="translate(288,588) scale(0.85)"><use href="#half" xlink:href="#half"/></g>
  <text x="310" y="592" font-size="11.5" fill="#2B3440">види се тек ако је пакет и потписан</text>

  <g transform="translate(590,588) scale(0.85)"><use href="#no" xlink:href="#no"/></g>
  <text x="612" y="592" font-size="11.5" fill="#2B3440">печат ово не види</text>

</svg>
