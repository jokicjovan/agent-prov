<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546A"/>
    </marker>
  </defs>

  <!-- ===== down arrows (main column, x=280) ===== -->
  <line x1="280" y1="114" x2="280" y2="152" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="292" y="138" font-size="11" fill="#6B7686">повратни позиви (callbacks)</text>
  <line x1="280" y1="262" x2="280" y2="298" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="292" y="284" font-size="11" fill="#6B7686">креирање записа: add_agent_step / add_tool_invocation</text>
  <line x1="280" y1="378" x2="280" y2="414" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="280" y1="494" x2="280" y2="526" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="292" y="516" font-size="11" fill="#6B7686">валидација + печат</text>

  <!-- ===== L1: LangGraph pipeline ===== -->
  <rect x="60" y="44" width="440" height="70" rx="9" fill="#F3F6FA" stroke="#8A94A6" stroke-width="1.5"/>
  <text x="280" y="74" font-size="15" font-weight="650" fill="#1F2937" text-anchor="middle">Агентни ток обраде - LangGraph</text>
  <text x="280" y="94" font-size="11" fill="#6B7686" text-anchor="middle">агенти и позиви алата &#183; логика неизмењена</text>

  <!-- ===== L2: Middleware ===== -->
  <rect x="60" y="152" width="440" height="110" rx="9" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="280" y="176" font-size="14" font-weight="650" fill="#1F2937" text-anchor="middle">ProvenanceMiddleware</text>
  <rect x="86" y="192" width="180" height="52" rx="7" fill="#FFFFFF" stroke="#B7C2D2" stroke-width="1.3"/>
  <text x="176" y="217" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle" font-family="'Consolas','Courier New',monospace">step_emitter</text>
  <text x="176" y="233" font-size="10" fill="#6B7686" text-anchor="middle">корак агента</text>
  <rect x="294" y="192" width="180" height="52" rx="7" fill="#FFFFFF" stroke="#B7C2D2" stroke-width="1.3"/>
  <text x="384" y="217" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle" font-family="'Consolas','Courier New',monospace">tool_emitter</text>
  <text x="384" y="233" font-size="10" fill="#6B7686" text-anchor="middle">позив алата</text>

  <!-- ===== L3: PipelineSession ===== -->
  <rect x="60" y="298" width="440" height="80" rx="9" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="280" y="330" font-size="15" font-weight="650" fill="#1F2937" text-anchor="middle">PipelineSession</text>
  <text x="280" y="351" font-size="11" fill="#6B7686" text-anchor="middle">чува уређени низ записа + родитељски ланац</text>

  <!-- ===== L4: BundleGenerator ===== -->
  <rect x="60" y="414" width="440" height="80" rx="9" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="280" y="446" font-size="15" font-weight="650" fill="#1F2937" text-anchor="middle">BundleGenerator</text>
  <text x="280" y="467" font-size="11" fill="#6B7686" text-anchor="middle">валидација (шема + вредносна правила) + печат bundle_hash</text>

  <!-- ===== L5: sealed bundle ===== -->
  <rect x="60" y="526" width="440" height="58" rx="9" fill="#E6ECF5" stroke="#2F5496" stroke-width="1.6"/>
  <text x="280" y="551" font-size="14" font-weight="650" fill="#24406F" text-anchor="middle">Pipeline Bundle (запечаћен)</text>
  <text x="280" y="569" font-size="10.5" fill="#3B5488" text-anchor="middle">печат открива накнадне измене</text>

  <!-- ===== HumanReview (accent, novelty) ===== -->
  <rect x="560" y="298" width="290" height="80" rx="9" fill="#2F5496" stroke="#24406F" stroke-width="1.6"/>
  <text x="705" y="330" font-size="14" font-weight="650" fill="#FFFFFF" text-anchor="middle">HumanReview</text>
  <text x="705" y="351" font-size="10.5" fill="#D6E0F1" text-anchor="middle">контекстни менаџер &#183; људска одлука</text>
  <text x="705" y="367" font-size="10.5" fill="#D6E0F1" text-anchor="middle">emituje human_intervention</text>
  <line x1="558" y1="338" x2="502" y2="338" stroke="#2F5496" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ===== persistence (optional) ===== -->
  <rect x="560" y="192" width="290" height="52" rx="8" fill="#F3F6FA" stroke="#8A94A6" stroke-width="1.4"/>
  <text x="705" y="214" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">persistence (опционо)</text>
  <text x="705" y="231" font-size="10" fill="#6B7686" text-anchor="middle">NDJSON дневник отпоран на падове</text>
  <path d="M500 318 C 540 300, 540 250, 558 232" fill="none" stroke="#8A94A6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>

  <!-- ===== consumers over the sealed bundle ===== -->
  <rect x="560" y="470" width="290" height="114" rx="9" fill="#FFFFFF" stroke="#B7C2D2" stroke-width="1.4"/>
  <text x="576" y="492" font-size="11" fill="#6B7686">независни потрошачи над запечаћеним пакетом:</text>
  <g font-size="12.5" fill="#1F2937">
    <text x="576" y="516" font-family="'Consolas','Courier New',monospace">verify</text><text x="642" y="516" fill="#6B7686" font-size="11"> - верификатор интегритета</text>
    <text x="576" y="540" font-family="'Consolas','Courier New',monospace">signing</text><text x="648" y="540" fill="#6B7686" font-size="11"> - Ed25519 потпис</text>
    <text x="576" y="564" font-family="'Consolas','Courier New',monospace">reporting</text><text x="662" y="564" fill="#6B7686" font-size="11"> - PDF извештај</text>
  </g>
  <line x1="502" y1="555" x2="558" y2="530" stroke="#44546A" stroke-width="1.5" marker-end="url(#arw)"/>
</svg>
