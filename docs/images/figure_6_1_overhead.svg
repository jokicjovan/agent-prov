<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif">
  <!-- ===== gridlines (recessive) ===== -->
  <g stroke="#E6E9EE" stroke-width="1">
    <line x1="78" y1="40"  x2="620" y2="40"/>
    <line x1="78" y1="120" x2="620" y2="120"/>
    <line x1="78" y1="200" x2="620" y2="200"/>
    <line x1="78" y1="280" x2="620" y2="280"/>
    <line x1="78" y1="360" x2="620" y2="360"/>
  </g>

  <!-- ===== y axis labels ===== -->
  <g font-size="11" fill="#6B7686" text-anchor="end">
    <text x="68" y="364">0</text>
    <text x="68" y="284">5</text>
    <text x="68" y="204">10</text>
    <text x="68" y="124">15</text>
    <text x="68" y="44">20</text>
  </g>

  <!-- ===== axes ===== -->
  <line x1="78" y1="40" x2="78" y2="360" stroke="#9AA3B0" stroke-width="1.2"/>
  <line x1="78" y1="360" x2="620" y2="360" stroke="#9AA3B0" stroke-width="1.2"/>

  <!-- ===== x axis ticks + labels ===== -->
  <g font-size="11" fill="#6B7686" text-anchor="middle">
    <text x="97.7"  y="380">2</text>
    <text x="137.1" y="380">6</text>
    <text x="186.4" y="380">11</text>
    <text x="334.2" y="380">26</text>
    <text x="580.6" y="380">51</text>
  </g>

  <!-- ===== axis titles ===== -->
  <text x="349" y="410" font-size="12.5" fill="#44546A" text-anchor="middle">број записа у пакету</text>
  <text x="24" y="200" font-size="12.5" fill="#44546A" text-anchor="middle" transform="rotate(-90 24 200)">режијски трошак (ms)</text>

  <!-- ===== series: agent_steps (blue) ===== -->
  <polyline points="97.7,343.9 137.1,329.1 186.4,309.5 334.2,253.5 580.6,157.6"
            fill="none" stroke="#2F5496" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#2F5496" stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="97.7"  cy="343.9" r="4.2"/>
    <circle cx="137.1" cy="329.1" r="4.2"/>
    <circle cx="186.4" cy="309.5" r="4.2"/>
    <circle cx="334.2" cy="253.5" r="4.2"/>
    <circle cx="580.6" cy="157.6" r="4.2"/>
  </g>

  <!-- ===== series: hitl (orange) ===== -->
  <polyline points="97.7,344.1 137.1,319.8 186.4,290.3 334.2,201.4 580.6,55.1"
            fill="none" stroke="#C05617" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#C05617" stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="97.7"  cy="344.1" r="4.2"/>
    <circle cx="137.1" cy="319.8" r="4.2"/>
    <circle cx="186.4" cy="290.3" r="4.2"/>
    <circle cx="334.2" cy="201.4" r="4.2"/>
    <circle cx="580.6" cy="55.1" r="4.2"/>
  </g>

  <!-- ===== direct labels at line ends ===== -->
  <text x="592" y="162" font-size="12" font-weight="600" fill="#2F5496">agent_steps</text>
  <text x="592" y="58"  font-size="12" font-weight="600" fill="#C05617">hitl</text>

  <!-- ===== legend ===== -->
  <g>
    <line x1="96" y1="56" x2="120" y2="56" stroke="#2F5496" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="108" cy="56" r="3.6" fill="#2F5496" stroke="#FFFFFF" stroke-width="1.3"/>
    <text x="128" y="60" font-size="11.5" fill="#44546A">agent_steps (кораци агената)</text>
    <line x1="96" y1="76" x2="120" y2="76" stroke="#C05617" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="108" cy="76" r="3.6" fill="#C05617" stroke="#FFFFFF" stroke-width="1.3"/>
    <text x="128" y="80" font-size="11.5" fill="#44546A">hitl (кораци + људске интервенције)</text>
  </g>
</svg>
