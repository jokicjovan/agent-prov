<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546A"/>
    </marker>
  </defs>

  <!-- ===== flow arrows (main pipeline) ===== -->
  <line x1="146" y1="150" x2="184" y2="150" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="344" y1="150" x2="382" y2="150" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="536" y1="150" x2="574" y2="150" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="728" y1="150" x2="766" y2="150" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="946" y1="150" x2="984" y2="150" stroke="#44546A" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ===== tool call branch (bidirectional) ===== -->
  <line x1="266" y1="187" x2="266" y2="288" stroke="#8A94A6" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="278" y="243" font-size="12" fill="#6B7686">позив алата</text>

  <!-- ===== node: Упит (I/O) ===== -->
  <rect x="28" y="121" width="118" height="58" rx="29" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
  <text x="87" y="147" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">Упит</text>
  <text x="87" y="165" font-size="11" fill="#6B7686" text-anchor="middle">улаз</text>

  <!-- ===== node: Истраживач ===== -->
  <rect x="188" y="115" width="156" height="70" rx="8" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="266" y="146" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">researcher</text>
  <text x="266" y="165" font-size="11" fill="#6B7686" text-anchor="middle">агент</text>

  <!-- ===== node: Сажиматељ ===== -->
  <rect x="386" y="115" width="150" height="70" rx="8" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="461" y="146" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">summarizer</text>
  <text x="461" y="165" font-size="11" fill="#6B7686" text-anchor="middle">агент</text>

  <!-- ===== node: Писац ===== -->
  <rect x="578" y="115" width="150" height="70" rx="8" fill="#EEF1F6" stroke="#44546A" stroke-width="1.5"/>
  <text x="653" y="146" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">writer</text>
  <text x="653" y="165" font-size="11" fill="#6B7686" text-anchor="middle">агент</text>

  <!-- ===== node: Људска рецензија (accent - the novelty) ===== -->
  <rect x="770" y="115" width="176" height="70" rx="8" fill="#2F5496" stroke="#24406F" stroke-width="1.5"/>
  <text x="858" y="146" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Људска рецензија</text>
  <text x="858" y="165" font-size="11" fill="#D6E0F1" text-anchor="middle">људски надзор</text>

  <!-- ===== node: Коначан излаз (I/O) ===== -->
  <rect x="988" y="121" width="144" height="58" rx="29" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
  <text x="1060" y="147" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">Коначан излаз</text>
  <text x="1060" y="165" font-size="11" fill="#6B7686" text-anchor="middle">излаз</text>

  <!-- ===== node: Алат ===== -->
  <rect x="190" y="290" width="152" height="58" rx="8" fill="#F3F6FA" stroke="#8A94A6" stroke-width="1.5"/>
  <text x="266" y="315" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">Алат</text>
  <text x="266" y="333" font-size="11" fill="#6B7686" text-anchor="middle">нпр. веб-претрага</text>

  <!-- ===== legend ===== -->
  <rect x="28"  y="374" width="14" height="14" rx="3" fill="#EEF1F6" stroke="#44546A" stroke-width="1.2"/>
  <text x="48"  y="385" font-size="12" fill="#4B5563">агент</text>
  <rect x="112" y="374" width="14" height="14" rx="3" fill="#F3F6FA" stroke="#8A94A6" stroke-width="1.2"/>
  <text x="132" y="385" font-size="12" fill="#4B5563">алат</text>
  <rect x="182" y="374" width="14" height="14" rx="3" fill="#2F5496" stroke="#24406F" stroke-width="1.2"/>
  <text x="202" y="385" font-size="12" fill="#4B5563">људска рецензија (HITL)</text>
  <rect x="392" y="374" width="14" height="14" rx="7" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>
  <text x="412" y="385" font-size="12" fill="#4B5563">улаз / излаз</text>
</svg>
